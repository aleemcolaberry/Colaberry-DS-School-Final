function summary(res){const parts=[];for(const w of WIDTHS){const r=res.widths[w];if(!r)continue;if(r.error){parts.push(w+': ERR '+r.error);continue}parts.push(w+': sw'+r.scrollW+' ov'+r.overflow.length+' sp'+r.spill.length+' cl'+r.clipped.length+' ct'+r.contrast.length+'(+'+r.contrastImg+'img) nt'+(r.nonText?r.nonText.length:0)+' tiny'+r.tiny.length+(w===390?' touch'+r.touch.length:''))}
  if(res.dark)parts.push('dark: ct'+(res.dark.contrast?res.dark.contrast.length:'ERR')+' islands'+(res.dark.lightIslands?res.dark.lightIslands.length:'?'));
  const a=res.a11y;if(a&&!a.error)parts.push('a11y: lang'+(a.lang?'✓':'✗')+' main'+a.main+' h1x'+a.h1+' skips'+a.headingSkips.length+' noalt'+a.imgNoAlt.length+' unnamed'+a.unnamedControls.length+' unlabeled'+a.unlabeledInputs.length+' dupId'+a.dupIds.length+' href#'+a.emptyHref.length+' broken'+a.brokenImgs.length+' rm'+a.reducedMotion);

function load(fr,src){return new Promise(r=>{let done=false;fr.onload=()=>{if(!done){done=true;r()}};fr.src=src+(src.includes('?')?'&':'?')+'_='+Date.now();sleep(8000).then(()=>{if(!done){done=true;r()}})})}
const DARK=new Set(['../index.html','../design-system.html','../playbook.html','../app/index.html','../app/login.html','../app/register.html','../app/dashboard.html','../app/legal.html','../app/thank-you.html']);
async function runPage(p,settle=1500){const res={page:p,widths:{}};log('▶ '+p);
  for(const w of WIDTHS){const fr=$('f'+w);await load(fr,p);await sleep(settle);
    try{res.widths[w]=probe(fr,w,{touch:w===390})}catch(e){res.widths[w]={error:String(e)}}
    if(w===1280){try{res.a11y=a11y(fr)}catch(e){res.a11y={error:String(e)}}
      try{res.perf=perf(fr)}catch(e){res.perf={error:String(e)}}

  RESULTS[p]=res;log('   '+summary(res));return res}
