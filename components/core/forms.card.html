<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css?v=3be3c64e">
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/vendor/react.production.min.js"></script>
<script src="../../assets/vendor/react-dom.production.min.js"></script>
<script src="../../assets/vendor/babel.min.js"></script>
<script src="../../_ds_bundle.js?v=d038218c"></script>
<script type="text/babel">
  const { Input, Checkbox, Button, Select, RadioGroup } = window.ColaberryDesignSystem_098454;
  function Demo() {
    return (
      <div className="grid">
        <div className="stack">
          <Input label="Full name" placeholder="Ada Lovelace" required autoComplete="name" />
          <Input label="Email" type="email" inputMode="email" placeholder="ada@email.com" helperText="We'll send your catalog here." />
          <Input label="Phone" error="Enter a 10-digit number, like 972 555 0144." defaultValue="123" />
          <Input label="Username" success="Available" defaultValue="ada.l" />
          <Input label="Referral code" optional disabled placeholder="Opens after you apply" />
        </div>
        <div className="stack">
          <Select label="Program" placeholder="Choose a program" required options={['Data Analytics', 'Data Science', 'AI Architect Accelerator']} />
          <RadioGroup label="How will you attend?" defaultValue="live" direction="row" options={[{ value: 'live', label: 'Live online' }, { value: 'campus', label: 'On campus' }]} />
          <Checkbox label="Email me about upcoming cohorts" defaultChecked />
          <Checkbox label="I agree to the terms of enrollment" required error="Tick this box to continue." />
          <Button fullWidth>Request info</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
